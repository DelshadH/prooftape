name: ProofTape record
description: Record one supported application-to-dependency runtime surface as a versioned capsule.
inputs:
  dependency:
    description: Exact npm package name to observe
    required: true
  command:
    description: Direct test command; shell syntax is rejected
    required: true
  working-directory:
    description: Repository-relative application directory
    required: false
    default: "."
  output:
    description: Application-directory-relative capsule path
    required: false
    default: ".prooftape/capsule.ptape"
  timeout-ms:
    description: Test timeout in milliseconds
    required: false
    default: "120000"
outputs:
  capsule-path:
    description: Absolute path of the generated capsule
    value: ${{ steps.record.outputs.capsule-path }}
  capsule-sha256:
    description: SHA-256 for checking capsule transport; it does not authenticate observations
    value: ${{ steps.record.outputs.capsule-sha256 }}
runs:
  using: composite
  steps:
    - id: record
      shell: bash
      env:
        PROOFTAPE_ACTION_COMMAND: ${{ inputs.command }}
        PROOFTAPE_ACTION_DEPENDENCY: ${{ inputs.dependency }}
        PROOFTAPE_ACTION_OUTPUT: ${{ inputs.output }}
        PROOFTAPE_ACTION_TIMEOUT_MS: ${{ inputs.timeout-ms }}
        PROOFTAPE_ACTION_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH/../.."
        npm ci --ignore-scripts --no-audit --no-fund
        npm run build
        node scripts/action-record.mjs
