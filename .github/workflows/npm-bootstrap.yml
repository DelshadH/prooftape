name: Bootstrap first npm publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact reviewed release tag
        required: true
        type: string
        default: v0.1.0-alpha.1
      expected_commit:
        description: Full reviewed main commit resolved by the tag
        required: true
        type: string
      publish:
        description: Publish the four real alpha packages after preparation
        required: true
        type: boolean
        default: false
      confirm_token_exception:
        description: Enter ONE_TIME_TOKEN_AUTHORIZED only after owner approval
        required: true
        type: string
        default: DO_NOT_PUBLISH

permissions:
  contents: read

env:
  RELEASE_VERSION: "0.1.0-alpha.1"
  NPM_VERSION: "11.16.0"
  POSTPUBLISH_MAX_ATTEMPTS: "31"
  POSTPUBLISH_MAX_DURATION_MS: "300000"
  POSTPUBLISH_RETRY_DELAY_MS: "10000"

concurrency:
  group: prooftape-npm-bootstrap-v0.1.0-alpha.1
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate first-publication identity
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reject any ref or commit other than the reviewed release
        env:
          PROOFTAPE_RELEASE_REF: ${{ github.ref }}
          PROOFTAPE_RELEASE_TAG: ${{ inputs.tag }}
          PROOFTAPE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PROOFTAPE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          EXPECTED_TAG="v${RELEASE_VERSION}"
          EXPECTED_REF="refs/tags/${EXPECTED_TAG}"
          if [[ "${PROOFTAPE_RELEASE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Expected ${EXPECTED_TAG}; received ${PROOFTAPE_RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${PROOFTAPE_RELEASE_REF}" != "${EXPECTED_REF}" ]]; then
            echo "Expected workflow ref ${EXPECTED_REF}; received ${PROOFTAPE_RELEASE_REF}" >&2
            exit 1
          fi
          if [[ ! "${PROOFTAPE_EXPECTED_COMMIT}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "expected_commit must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ "${PROOFTAPE_WORKFLOW_SHA}" != "${PROOFTAPE_EXPECTED_COMMIT}" ]]; then
            echo "Workflow SHA does not equal expected_commit" >&2
            exit 1
          fi
      - name: Check out the exact reviewed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag resolves to the expected protected-main commit
        env:
          PROOFTAPE_RELEASE_TAG: ${{ inputs.tag }}
          PROOFTAPE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "${PROOFTAPE_EXPECTED_COMMIT}"
          test "$(git rev-list -n 1 "${PROOFTAPE_RELEASE_TAG}")" = "${PROOFTAPE_EXPECTED_COMMIT}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${PROOFTAPE_EXPECTED_COMMIT}" refs/remotes/origin/main
      - name: Set up Node without a registry credential
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Install and verify the exact npm release
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
      - name: Install the exact lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run typecheck and all tests
        run: npm run check
      - name: Test the packed CLI and Action
        run: npm run smoke:package
      - name: Run project-owned consumer examples
        run: npm run smoke:examples
      - name: Run the clean-room killer demo
        run: npm run demo
      - name: Generate the bounded terminal demo recording
        run: npm run demo:record
      - name: Run isolated real-package upgrade gates
        run: npm run real-upgrades
      - name: Run the public compatibility corpus
        run: npm run corpus
      - name: Enforce the published performance budget
        run: npm run performance
      - name: Run dependency, source, secret, and workflow security checks
        run: npm run security
      - name: Build twice from clean source and prepare release evidence
        run: npm run release:prepare
      - name: Verify exact evidence, immutable hashes, contents, and empty registry
        env:
          PROOFTAPE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          node scripts/npm-bootstrap-verify.mjs preflight \
            --dir .evidence/release \
            --commit "${PROOFTAPE_EXPECTED_COMMIT}" \
            --out .evidence/npm-bootstrap-preflight.json \
            --replace
      - name: Upload dry-run and exact release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prooftape-0.1.0-alpha.1-npm-bootstrap-evidence
          path: |
            .evidence/release
            .evidence/npm-bootstrap-preflight.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish the real alpha once
    needs: prepare
    if: ${{ inputs.publish && inputs.confirm_token_exception == 'ONE_TIME_TOKEN_AUTHORIZED' }}
    environment: npm-bootstrap
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact reviewed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate publish-job workflow, checkout, and tag identity
        env:
          PROOFTAPE_RELEASE_TAG: ${{ inputs.tag }}
          PROOFTAPE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PROOFTAPE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test "${PROOFTAPE_WORKFLOW_SHA}" = "${PROOFTAPE_EXPECTED_COMMIT}"
          test "$(git rev-parse HEAD)" = "${PROOFTAPE_EXPECTED_COMMIT}"
          test "$(git rev-list -n 1 "${PROOFTAPE_RELEASE_TAG}")" = "${PROOFTAPE_EXPECTED_COMMIT}"
      - name: Set up Node and the npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install and verify the exact npm release
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
      - name: Download the same-run reviewed evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prooftape-0.1.0-alpha.1-npm-bootstrap-evidence
          path: .evidence
      - name: Recheck evidence and registry absence immediately before authentication
        env:
          PROOFTAPE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          node scripts/npm-bootstrap-verify.mjs preflight \
            --dir .evidence/release \
            --commit "${PROOFTAPE_EXPECTED_COMMIT}" \
            --out .evidence/npm-bootstrap-publish-preflight.json \
            --replace
      - name: Publish reviewed packages and immediately revoke the token
        id: authenticated_publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          PROOFTAPE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          set +x
          attempted=()
          current=""
          failed_phase="authentication"
          revocation_attempted="false"
          revocation_succeeded="false"
          record_incident() {
            incident_args=(
              incident
              --commit "${PROOFTAPE_EXPECTED_COMMIT}"
              --failed-phase "${failed_phase}"
              --attempted "$(IFS=,; echo "${attempted[*]}")"
              --revocation-attempted "${revocation_attempted}"
              --revocation-succeeded "${revocation_succeeded}"
              --out .evidence/npm-bootstrap-incident.json
              --replace
            )
            if [[ -n "${current}" ]]; then
              incident_args+=(--failed-package "${current}")
            fi
            node scripts/npm-bootstrap-verify.mjs "${incident_args[@]}" || true
          }
          finish_authenticated_step() {
            status=$?
            trap - EXIT
            revocation_status=0
            revocation_attempted="true"
            if ! npm logout --registry=https://registry.npmjs.org/; then
              revocation_status=1
              echo "The one-time npm token could not be revoked." >&2
            else
              revocation_succeeded="true"
            fi
            if [ "$status" -ne 0 ] || [ "$revocation_status" -ne 0 ]; then
              if [ "$status" -eq 0 ]; then
                failed_phase="token-revocation"
                current=""
              fi
              record_incident
            fi
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            exit "$revocation_status"
          }
          publish_one() {
            failed_phase="publish"
            current="$1"
            attempted+=("$1")
            npm publish "$2" --access public --provenance --tag alpha
          }
          trap finish_authenticated_step EXIT
          npm whoami >/dev/null
          publish_one "@prooftape/schema" ".evidence/release/prooftape-schema-0.1.0-alpha.1.tgz"
          publish_one "@prooftape/core" ".evidence/release/prooftape-core-0.1.0-alpha.1.tgz"
          publish_one "@prooftape/hook" ".evidence/release/prooftape-hook-0.1.0-alpha.1.tgz"
          publish_one "prooftape" ".evidence/release/prooftape-0.1.0-alpha.1.tgz"
      - name: Verify registry bytes, metadata, alpha tag, and provenance identity
        id: postpublish_verification
        env:
          PROOFTAPE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          node scripts/npm-bootstrap-verify.mjs postpublish \
            --dir .evidence/release \
            --commit "${PROOFTAPE_EXPECTED_COMMIT}" \
            --max-attempts "${POSTPUBLISH_MAX_ATTEMPTS}" \
            --max-duration-ms "${POSTPUBLISH_MAX_DURATION_MS}" \
            --retry-delay-ms "${POSTPUBLISH_RETRY_DELAY_MS}" \
            --out .evidence/npm-bootstrap-publication-verification.json \
            --replace
          mkdir -p .evidence/npm-signature-audit
          cd .evidence/npm-signature-audit
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact \
            "@prooftape/schema@0.1.0-alpha.1" \
            "@prooftape/core@0.1.0-alpha.1" \
            "@prooftape/hook@0.1.0-alpha.1" \
            "prooftape@0.1.0-alpha.1"
          npm audit signatures
      - name: Upload registry verification
        id: publication_verification_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prooftape-0.1.0-alpha.1-npm-publication-verification
          path: .evidence/npm-bootstrap-publication-verification.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Confirm authenticated publication incident evidence
        id: authenticated_incident
        if: ${{ failure() && steps.authenticated_publish.outcome == 'failure' }}
        run: test -f .evidence/npm-bootstrap-incident.json
      - name: Record post-publication verification incident
        id: postpublish_incident
        if: ${{ failure() && steps.authenticated_publish.outcome == 'success' }}
        env:
          PROOFTAPE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PROOFTAPE_VERIFICATION_OUTCOME: ${{ steps.postpublish_verification.outcome }}
        run: |
          stage="verification-artifact-upload"
          if [[ "${PROOFTAPE_VERIFICATION_OUTCOME}" != "success" ]]; then
            stage="registry-provenance-signatures"
          fi
          node scripts/npm-bootstrap-verify.mjs incident \
            --commit "${PROOFTAPE_EXPECTED_COMMIT}" \
            --failed-phase postpublish-verification \
            --verification-stage "${stage}" \
            --attempted "@prooftape/schema,@prooftape/core,@prooftape/hook,prooftape" \
            --revocation-attempted true \
            --revocation-succeeded true \
            --out .evidence/npm-bootstrap-incident.json \
            --replace
      - name: Preserve publication incident evidence
        if: >-
          ${{
            always()
            && (
              steps.authenticated_incident.outcome == 'success'
              || steps.postpublish_incident.outcome == 'success'
            )
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prooftape-0.1.0-alpha.1-npm-bootstrap-incident
          path: .evidence/npm-bootstrap-incident.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  release:
    name: Create verified GitHub prerelease
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact reviewed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate release-job workflow, checkout, and tag identity
        env:
          PROOFTAPE_RELEASE_TAG: ${{ inputs.tag }}
          PROOFTAPE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PROOFTAPE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test "${PROOFTAPE_WORKFLOW_SHA}" = "${PROOFTAPE_EXPECTED_COMMIT}"
          test "$(git rev-parse HEAD)" = "${PROOFTAPE_EXPECTED_COMMIT}"
          test "$(git rev-list -n 1 "${PROOFTAPE_RELEASE_TAG}")" = "${PROOFTAPE_EXPECTED_COMMIT}"
      - name: Set up the exact release Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Install and verify the exact npm release
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
      - name: Download the same-run reviewed evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prooftape-0.1.0-alpha.1-npm-bootstrap-evidence
          path: .evidence
      - name: Download verified registry and provenance evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prooftape-0.1.0-alpha.1-npm-publication-verification
          path: .evidence
      - name: Reverify downloaded receipt and release assets
        env:
          PROOFTAPE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          (cd .evidence/release && sha256sum --check SHA256SUMS)
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const receipt = JSON.parse(
            await readFile(
              ".evidence/npm-bootstrap-publication-verification.json",
              "utf8",
            ),
          );
          if (
            receipt.kind !== "prooftape-npm-bootstrap-publication-verification"
            || receipt.version !== process.env.RELEASE_VERSION
            || receipt.expectedCommit !== process.env.PROOFTAPE_EXPECTED_COMMIT
            || receipt.authenticationPresent !== false
            || receipt.passed !== true
          ) {
            throw new Error("publication verification receipt identity mismatch");
          }
          NODE
      - name: Create the GitHub prerelease after npm verification
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          PROOFTAPE_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "${PROOFTAPE_RELEASE_TAG}" \
            --verify-tag \
            --prerelease \
            --title "ProofTape ${RELEASE_VERSION}" \
            --notes-file docs/release-notes-0.1.0-alpha.1.md \
            .evidence/release/* \
            .evidence/npm-bootstrap-publication-verification.json
      - name: Record GitHub prerelease creation incident
        id: github_release_incident
        if: ${{ failure() }}
        env:
          PROOFTAPE_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          node scripts/npm-bootstrap-verify.mjs incident \
            --commit "${PROOFTAPE_EXPECTED_COMMIT}" \
            --failed-phase postpublish-verification \
            --verification-stage github-release-creation \
            --attempted "@prooftape/schema,@prooftape/core,@prooftape/hook,prooftape" \
            --revocation-attempted true \
            --revocation-succeeded true \
            --out .evidence/npm-bootstrap-incident.json \
            --replace
      - name: Preserve GitHub prerelease incident evidence
        if: ${{ always() && steps.github_release_incident.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prooftape-0.1.0-alpha.1-github-release-incident
          path: .evidence/npm-bootstrap-incident.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
